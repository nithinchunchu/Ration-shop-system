<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
  <title id="title">Smart Ration Delivery</title>
  <desc id="desc">Visual showing beneficiary ordering, ration store supplies, and local delivery.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f2f53"/>
      <stop offset="100%" stop-color="#144d79"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0f7ff"/>
    </linearGradient>
  </defs>
  <rect width="900" height="560" rx="30" fill="url(#bg)"/>
  <circle cx="120" cy="110" r="90" fill="#58d9bd" fill-opacity="0.18"/>
  <circle cx="780" cy="90" r="80" fill="#ffca79" fill-opacity="0.2"/>

