  <rect x="88" y="318" width="184" height="24" rx="8" fill="#e2edfb"/>
  <rect x="88" y="352" width="140" height="22" rx="8" fill="#e2edfb"/>
  <rect x="88" y="386" width="164" height="22" rx="8" fill="#e2edfb"/>

