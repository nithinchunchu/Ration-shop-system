<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" role="img" aria-labelledby="title desc">\n  <title id="title">User Portal Illustration</title>\n  <desc id="desc">User checking ration card and monthly allocation in a dashboard.</desc>\n  <defs>\n    <linearGradient id=\"bg\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"1\">\n      <stop offset=\"0%\" stop-color=\"#184976\"/>\n      <stop offset=\"100%\" stop-color=\"#0d2f50\"/>\n    </linearGradient>\n    <linearGradient id=\"card\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\">\n      <stop offset=\"0%\" stop-color=\"#f8fbff\"/>\n      <stop offset=\"100%\" stop-color=\"#e2f0ff\"/>\n    </linearGradient>\n  </defs>\n  <rect width=\"720\" height=\"480\" rx=\"26\" fill=\"url(#bg)\"/>\n  <circle cx=\"96\" cy=\"86\" r=\"58\" fill=\"#47dcc0\" fill-opacity=\"0.28\"/>\n  <circle cx=\"632\" cy=\"68\" r=\"48\" fill=\"#ffd275\" fill-opacity=\"0.26\"/>\n\n  <rect x=\"92\" y=\"92\" width=\"536\" height=\"294\" rx=\"18\" fill=\"url(#card)\"/>\n  <rect x=\"92\" y=\"92\" width=\"536\" height=\"52\" rx=\"18\" fill=\"#6eb4e6\"/>\n  <text x=\"130\" y=\"126\" font-family=\"Verdana, sans-serif\" font-size=\"22\" font-weight=\"700\" fill=\"#f7fdff\">Beneficiary Dashboard</text>\n\n  <circle cx=\"170\" cy=\"214\" r=\"40\" fill=\"#2d5e86\"/>\n  <rect x=\"126\" y=\"257\" width=\"88\" height=\"74\" rx=\"14\" fill=\"#2d5e86\"/>\n\n  <rect x=\"258\" y=\"182\" width=\"316\" height=\"46\" rx=\"10\" fill=\"#dcecff\"/>\n  <rect x=\"258\" y=\"244\" width=\"280\" height=\"34\" rx=\"9\" fill=\"#dcecff\"/>\n  <rect x=\"258\" y=\"292\" width=\"220\" height=\"30\" rx=\"9\" fill=\"#dcecff\"/>\n\n  <rect x=\"258\" y=\"338\" width=\"170\" height=\"30\" rx=\"15\" fill=\"#f8c34d\"/>\n  <text x=\"343\" y=\"359\" text-anchor=\"middle\" font-family=\"Verdana, sans-serif\" font-size=\"16\" font-weight=\"700\" fill=\"#4b330b\">Place Order</text>\n</svg>